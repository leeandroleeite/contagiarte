name: Cópia de segurança

on:
  schedule:
    # Todos os dias às 04:15 UTC, fora das horas de visita.
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exportar conteúdo para o R2
        run: npx tsx scripts/copia-seguranca.ts
        env:
          APP_ENV: producao
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCAO }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
