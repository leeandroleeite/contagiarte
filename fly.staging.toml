# Staging: staging.contagiarte.pt
# Deploy com:  fly deploy --config fly.staging.toml
#
# Base de dados e bucket separados dos de produção. O acesso é
# protegido por STAGING_PASSWORD, definido como segredo.
app = "contagiarte-staging"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_R2_PUBLIC_URL = ""

[deploy]
  # As migrações correm no arranque, dentro do entrypoint, depois de o
  # Litestream restaurar. Um release_command não serviria: essa máquina
  # não tem o volume montado.
  strategy = "immediate"

[env]
  APP_ENV = "staging"
  # Enquanto o DNS não aponta para cá, o endereço público é o do Fly.
  # Trocar para https://staging.contagiarte.pt quando o CNAME existir:
  # isto alimenta canonicals, sitemap e os links de confirmação da
  # newsletter, e apontar para um domínio que ainda não responde só
  # criava links partidos.
  PUBLIC_URL = "https://contagiarte-staging.fly.dev"
  NODE_ENV = "production"
  DADOS_DIR = "/dados"
  # O Litestream lê estes nomes. Ficam no ambiente da máquina, e não só
  # dentro do entrypoint, para o comando `litestream` também funcionar
  # à mão por SSH quando for preciso restaurar ou conferir.
  LITESTREAM_BUCKET = "contagiarte-backups"
  LITESTREAM_ENDPOINT = "https://4efa5cd804af038feae75a721eede909.r2.cloudflarestorage.com"
  LITESTREAM_REGION = "auto"
  LITESTREAM_CAMINHO = "staging"
  PORT = "3000"

[[mounts]]
  # A base de dados é um ficheiro e vive aqui. O volume prende a app a
  # uma máquina; em troca, as leituras deixam de atravessar a rede e a
  # cópia passa a ser contínua em vez de diária.
  source = "contagiarte_dados_staging"
  destination = "/dados"

[http_service]
  internal_port = 3000
  force_https = true
  # Staging pode adormecer: poupa e ninguém está à espera.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/saude"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
