name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    env:
      # A base de dados é um ficheiro em `var/`: não é preciso serviço
      # nenhum a acompanhar o runner.
      DADOS_DIR: var
      SESSION_SECRET: chave-de-teste-com-mais-de-trinta-e-dois-caracteres
      PUBLIC_URL: http://localhost:3000
      APP_ENV: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run tipos

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Migrações
        run: node scripts/migrar.mjs

      - name: Semear
        run: npm run bd:semear-ci
        env:
          ADMIN_EMAIL: teste@contagiarte.pt
          ADMIN_PASSWORD: palavra-passe-de-teste-ci

      - name: Compilar
        run: npm run build

      - name: Instalar browsers de teste
        run: npx playwright install --with-deps chromium webkit

      - name: Testes ponta a ponta
        run: npx playwright test
        env:
          PUBLIC_URL: http://127.0.0.1:3100
          # O travão por IP existe para travar abuso, não os testes,
          # que correm todos do mesmo endereço.
          LIMITE_FORMULARIOS: 200

      - name: Guardar relatório quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
