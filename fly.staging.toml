# Staging: staging.contagiarte.pt
# Deploy com:  fly deploy --config fly.staging.toml
#
# Base de dados e bucket separados dos de produção. O acesso é
# protegido por STAGING_PASSWORD, definido como segredo.
app = "contagiarte-staging"
primary_region = "mad"
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_R2_PUBLIC_URL = ""

[deploy]
  release_command = "node scripts/migrar.mjs"
  strategy = "immediate"

[env]
  APP_ENV = "staging"
  PUBLIC_URL = "https://staging.contagiarte.pt"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Staging pode adormecer: poupa e ninguém está à espera.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/saude"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
