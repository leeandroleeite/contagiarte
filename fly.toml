# Produção: www.contagiarte.pt
# Deploy com:  fly deploy --config fly.toml
app = "contagiarte"
primary_region = "cdg"          # Paris: a mais perto de Portugal desde
                                # que o Fly fechou Madrid
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[build.args]
  # Domínio público do bucket R2. Tem de entrar na compilação porque é
  # uma variável NEXT_PUBLIC_*.
  # Vazio enquanto media.contagiarte.pt não existir: as fotografias
  # saem por /api/media/..., que funciona. Assim que o domínio do bucket
  # estiver ligado, pôr aqui e voltar a compilar.
  NEXT_PUBLIC_R2_PUBLIC_URL = ""

[deploy]
  # As migrações correm no arranque, dentro do entrypoint, depois de o
  # Litestream restaurar. Um release_command não serviria: essa máquina
  # não tem o volume montado.
  strategy = "immediate"

[env]
  APP_ENV = "producao"
  # Enquanto o DNS não aponta para cá, o endereço público é o do Fly.
  # Isto alimenta canonicals, sitemap e os links de confirmação da
  # newsletter: apontar para um domínio que ainda não responde só criava
  # links partidos. Trocar para https://www.contagiarte.pt no dia em que
  # o DNS mudar.
  # Enquanto o apex não muda, o endereço público é o subdomínio novo.
  # Alimenta canónicos, sitemap, cartões de partilha e os links de
  # confirmação da newsletter: apontá-lo a um domínio que ainda não
  # responde só criava links partidos.
  PUBLIC_URL = "https://novo.contagiarte.pt"
  NODE_ENV = "production"
  DADOS_DIR = "/dados"
  # O Litestream lê estes nomes. Ficam no ambiente da máquina, e não só
  # dentro do entrypoint, para o comando `litestream` também funcionar
  # à mão por SSH quando for preciso restaurar ou conferir.
  LITESTREAM_BUCKET = "contagiarte-backups"
  LITESTREAM_ENDPOINT = "https://4efa5cd804af038feae75a721eede909.r2.cloudflarestorage.com"
  LITESTREAM_REGION = "auto"
  LITESTREAM_CAMINHO = "producao"
  PORT = "3000"

[[mounts]]
  # A base de dados é um ficheiro e vive aqui. O volume prende a app a
  # uma máquina; em troca, as leituras deixam de atravessar a rede e a
  # cópia passa a ser contínua em vez de diária.
  source = "contagiarte_dados"
  destination = "/dados"

[http_service]
  internal_port = 3000
  force_https = true
  # "stop" e não "suspend": com uma máquina sempre acordada, suspender
  # não poupa nada, e o caminho da suspensão deixou o proxy da Fly com
  # uma entrada de encaminhamento velha. A máquina respondia 200 na
  # porta interna, a verificação de saúde passava, e o mundo lá fora
  # via 502 com "could not find a good candidate". O staging, que usa
  # "stop", nunca teve o problema.
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Uma máquina sempre acordada: a galeria não quer o primeiro
  # visitante do dia à espera de um arranque a frio.
  min_machines_running = 1
  processes = ["app"]

  # Sem bloco de concorrência, por ora. Com `type = "requests"` e um
  # tecto de 200, o proxy da Fly passou a recusar a única máquina com
  # "could not find a good candidate within 40 attempts", mesmo sem
  # tráfego nenhum: a máquina respondia 200 por dentro e pela rede
  # privada, a verificação de saúde passava, e o mundo via 502. O
  # staging, que nunca declarou concorrência, nunca teve o problema.
  # Reavaliar quando houver tráfego a sério e mais de uma máquina.

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/saude"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
